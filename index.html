<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Eye-Juggler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --sky-top: #f6c27a;
    --sky-bottom: #e98a4b;
    --paper: #fbf3e4;
    --ink: #3b2416;
    --muted: #7a5a43;
    --accent: #b5462a;
    --accent-dark: #8a3220;
    --gold: #e0a526;
    --end-good: #3f7d4a;
    --end-bad: #9b2c2c;
    --shadow: rgba(59, 36, 22, 0.25);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Lora", Georgia, serif;
    color: var(--ink);
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 55%, #b85c34 100%);
    background-attachment: fixed;
    padding: 24px 16px 48px;
  }
  .sun {
    position: fixed; top: 40px; right: 8%;
    width: 110px; height: 110px; border-radius: 50%;
    background: radial-gradient(circle, #fff3c4 0%, #ffd56b 60%, rgba(255,213,107,0) 72%);
    pointer-events: none; z-index: 0;
  }
  .mesa {
    position: fixed; bottom: 0; left: 0; right: 0; height: 140px;
    pointer-events: none; z-index: 0;
  }
  main {
    position: relative; z-index: 1;
    max-width: 680px; margin: 0 auto;
  }
  header { text-align: center; margin-bottom: 20px; }
  h1 {
    font-family: "Rye", serif;
    font-weight: 400;
    font-size: clamp(2.2rem, 7vw, 3.4rem);
    margin: 0;
    color: #fffaf0;
    text-shadow: 3px 3px 0 var(--accent-dark), 0 0 20px rgba(0,0,0,0.15);
    letter-spacing: 1px;
  }
  .subtitle { color: #fff6e6; margin: 6px 0 0; font-style: italic; }
  .card {
    background: var(--paper);
    border-radius: 14px;
    padding: 28px 28px 24px;
    box-shadow: 0 10px 30px var(--shadow);
    border: 2px solid #e8d4b4;
    animation: fadeIn 0.4s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .tag {
    display: inline-block;
    font-size: 0.75rem; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--muted);
    border-bottom: 2px dotted var(--gold);
    margin-bottom: 6px;
  }
  h2 {
    font-family: "Rye", serif; font-weight: 400;
    font-size: 1.6rem; margin: 4px 0 16px; color: var(--accent-dark);
  }
  .story p { font-size: 1.12rem; line-height: 1.7; margin: 0 0 14px; }
  .story p.quote { font-style: italic; }
  .choice-label {
    margin: 22px 0 10px;
    font-family: "Rye", serif; font-size: 1.1rem; color: var(--accent);
    text-align: center;
  }
  .choices { display: grid; gap: 12px; }
  button {
    font: inherit; cursor: pointer;
  }
  .choice-btn {
    width: 100%;
    text-align: left;
    padding: 14px 18px;
    font-size: 1.05rem;
    color: #fffaf0;
    background: var(--accent);
    border: none;
    border-radius: 10px;
    box-shadow: 0 4px 0 var(--accent-dark);
    transition: transform 0.08s, box-shadow 0.08s, background 0.15s;
  }
  .choice-btn:hover { background: #c6553a; }
  .choice-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--accent-dark); }
  .choice-btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
  .end-box {
    margin-top: 20px; padding: 16px 18px; border-radius: 10px; text-align: center;
  }
  .end-box.good { background: #e3f0e2; border: 2px solid var(--end-good); }
  .end-box.bad { background: #f6e0dc; border: 2px solid var(--end-bad); }
  .end-title { font-family: "Rye", serif; font-size: 1.6rem; margin: 0 0 6px; }
  .end-box.good .end-title { color: var(--end-good); }
  .end-box.bad .end-title { color: var(--end-bad); }
  .lesson {
    margin-top: 16px; padding: 14px 16px;
    background: #fff8e1; border-left: 5px solid var(--gold); border-radius: 6px;
    font-style: italic;
  }
  .lesson strong { font-style: normal; font-family: "Rye", serif; font-weight: 400; color: var(--accent-dark); }
  .nav { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 20px; }
  .nav-btn {
    padding: 10px 18px; border-radius: 999px;
    background: transparent; color: var(--accent-dark);
    border: 2px solid var(--accent-dark); font-weight: 600;
  }
  .nav-btn:hover { background: var(--accent-dark); color: #fffaf0; }
  .nav-btn:disabled { opacity: 0.35; cursor: default; background: transparent; color: var(--accent-dark); }
  .trail {
    margin-top: 18px; text-align: center; font-size: 0.85rem; color: #fff6e6;
  }
  .endings {
    margin-top: 10px; text-align: center; color: #fff6e6; font-size: 0.9rem;
  }
  .stars { letter-spacing: 3px; }
  @media (max-width: 480px) {
    .card { padding: 20px 18px; }
    .story p { font-size: 1.04rem; }
    .sun { width: 70px; height: 70px; }
  }
</style>
</head>
<body>
<div class="sun"></div>
<svg class="mesa" viewBox="0 0 1200 140" preserveAspectRatio="none" aria-hidden="true">
  <path d="M0 140 L0 90 L120 90 L150 60 L330 60 L360 95 L520 95 L560 40 L760 40 L790 85 L940 85 L980 55 L1120 55 L1150 90 L1200 90 L1200 140 Z" fill="#8a3e22" opacity="0.55"/>
  <path d="M0 140 L0 115 L200 115 L240 100 L600 100 L640 118 L900 118 L940 105 L1200 105 L1200 140 Z" fill="#6b2d18" opacity="0.7"/>
</svg>

<main>
  <header>
    <h1>The Eye-Juggler</h1>
    <p class="subtitle">A Coyote story &mdash; choose your own path</p>
  </header>

  <div id="card" class="card" aria-live="polite"></div>

  <div class="nav">
    <button class="nav-btn" id="backBtn">&larr; Go Back</button>
    <button class="nav-btn" id="restartBtn">&#8634; Start Over</button>
  </div>

  <p class="trail" id="trail"></p>
  <p class="endings" id="endings"></p>
</main>

<script>
const LESSON = "Sometimes curiosity can lead to trouble, and listening to warnings can keep you safe.";

// Each scene: title, tag, text (array of paragraphs), choice label + choices, or ending type + moral
const story = {
  start: {
    tag: "The Beginning",
    title: "The Eye-Juggler",
    text: [
      "The Coyote was walking down a long road on a warm afternoon. He was enjoying his walk when he heard strange noises coming from the trees.",
      "He looked up and saw two little yellow birds playing a strange game. They were tossing their eyes high into the air and catching them again.",
      "The Coyote watched for a while.",
      "“Can I play?” he asked.",
      "The birds warned him that the game was difficult and dangerous, but the Coyote really wanted to try."
    ],
    choiceLabel: "Choice 1",
    choices: [
      { text: "Play the game.", to: "p1" },
      { text: "Keep walking.", to: "p2" }
    ]
  },

  p1: {
    tag: "Path 1",
    title: "Play the Game",
    text: [
      "The Coyote decided to play.",
      "He carefully removed his eyes and tossed them high into the air.",
      "For a moment, everything seemed to be going perfectly.",
      "But when he tried to catch them, his eyes flew into the tall trees.",
      "The Coyote reached around, trying to find them, but he couldn't.",
      "He was blind.",
      "He searched for a way to continue his journey and eventually found some yellow pitch. He shaped it into temporary eyes and placed them in his eye sockets.",
      "At first, he could see again.",
      "But the sun was getting hotter.",
      "The Coyote continued walking until he became tired.",
      "He found a willow tree and sat beneath it."
    ],
    choiceLabel: "Choice 2",
    choices: [
      { text: "Stay under the willow tree.", to: "p1a" },
      { text: "Keep walking.", to: "p1b" }
    ]
  },

  p1a: {
    tag: "Path 1A",
    title: "Stay Under the Willow Tree",
    text: [
      "The Coyote stayed underneath the willow tree.",
      "As the afternoon became hotter, the pitch holding his temporary eyes began to soften.",
      "He touched his face.",
      "His eyes were beginning to melt.",
      "“Oh no!” he cried.",
      "He quickly wrapped his face in bandages and tried to figure out what to do next.",
      "After a while, he heard two young girls nearby. They were laughing and wearing little bells."
    ],
    choiceLabel: "Choice 3",
    choices: [
      { text: "Follow the girls by listening to their bells.", to: "p1a1" },
      { text: "Stay where he is.", to: "p1a2" }
    ]
  },

  p1a1: {
    tag: "Path 1A-1",
    title: "Follow the Bells",
    text: [
      "The Coyote followed the sound of the girls' bells.",
      "He couldn't see them, so he had to listen carefully.",
      "The girls noticed that the Coyote was following them.",
      "They decided to trick him.",
      "They ran toward a steep red bluff and threw their jingling bells over the edge.",
      "The Coyote heard the bells and thought the girls were still ahead of him.",
      "He ran toward the sound."
    ],
    choiceLabel: "Choice 4",
    choices: [
      { text: "Jump toward the sound.", to: "p1a1a" },
      { text: "Stop and listen carefully.", to: "p1a1b" }
    ]
  },

  p1a1a: {
    tag: "Path 1A-1A",
    title: "The Bluff",
    text: [
      "The Coyote rushed toward the sound of the bells.",
      "He jumped forward, expecting to land safely.",
      "But there was nothing beneath him.",
      "He fell from the steep red bluff and landed on the rocks below."
    ],
    ending: "bad",
    moral: "The Coyote's pride and impatience had led him into danger."
  },

  p1a1b: {
    tag: "Path 1A-1B",
    title: "Stop and Listen",
    text: [
      "The Coyote stopped just before the edge.",
      "He listened carefully.",
      "The bells were no longer moving.",
      "He realized the sound was coming from far below.",
      "The Coyote understood that the girls had tricked him.",
      "He carefully backed away from the bluff."
    ],
    choiceLabel: "Choice 5",
    choices: [
      { text: "Search for another way down.", to: "p1a1b1" },
      { text: "Turn around and go home.", to: "p1a1b2" }
    ]
  },

  p1a1b1: {
    tag: "Path 1A-1B-1",
    title: "Another Way",
    text: [
      "The Coyote carefully searched for a safer path.",
      "After walking for a long time, he found a gentle trail leading down the bluff.",
      "He reached the bottom safely and continued along the road.",
      "Even though his journey had been difficult, he had learned that rushing into things could have serious consequences."
    ],
    ending: "good"
  },

  p1a1b2: {
    tag: "Path 1A-1B-2",
    title: "Go Home",
    text: [
      "The Coyote decided he had experienced enough trouble for one day.",
      "He turned around and slowly made his way home.",
      "He never played the eye game again."
    ],
    ending: "good"
  },

  p1a2: {
    tag: "Path 1A-2",
    title: "Stay Put",
    text: [
      "The Coyote decided it was safer to stay underneath the willow tree.",
      "After some time, the girls passed by.",
      "They saw the Coyote sitting under the tree with bandages around his eyes.",
      "Instead of bothering him, they continued down the road.",
      "The Coyote realized that sometimes the best choice is simply to wait rather than make a bad situation worse."
    ],
    ending: "good"
  },

  p1b: {
    tag: "Path 1B",
    title: "Keep Walking",
    text: [
      "The Coyote decided he could not stay under the willow forever.",
      "He wrapped his eyes with bandages and continued down the road.",
      "He had to use his ears and nose to figure out where he was going.",
      "Soon, he heard two girls laughing nearby.",
      "They were wearing little bells that jingled as they walked."
    ],
    choiceLabel: "Choice 3",
    choices: [
      { text: "Follow the sound of the bells.", to: "p1b1" },
      { text: "Ignore the bells and continue walking.", to: "p1b2" }
    ]
  },

  p1b1: {
    tag: "Path 1B-1",
    title: "Follow the Bells",
    text: [
      "The Coyote followed the sound of the bells.",
      "He couldn't see where he was going, but the jingling helped him follow the girls.",
      "The girls heard him coming.",
      "They decided to trick him.",
      "They ran toward a steep red bluff and threw their bells over the edge.",
      "The Coyote heard the bells below.",
      "He thought the girls had continued running."
    ],
    choiceLabel: "Choice 4",
    choices: [
      { text: "Jump toward the sound.", to: "p1b1a" },
      { text: "Stop and listen carefully.", to: "p1b1b" }
    ]
  },

  p1b1a: {
    tag: "Path 1B-1A",
    title: "The Fall",
    text: [
      "The Coyote rushed toward the sound.",
      "He leaped forward, expecting to catch up with the girls.",
      "Instead, he went over the edge of the bluff.",
      "He fell onto the rocks below."
    ],
    ending: "bad",
    moral: "The Coyote's decision to follow the sound without knowing where it was coming from led him into danger."
  },

  p1b1b: {
    tag: "Path 1B-1B",
    title: "Stop and Listen",
    text: [
      "The Coyote stopped.",
      "He listened carefully.",
      "The bells sounded strangely far away.",
      "He realized that the girls might be trying to trick him.",
      "He slowly backed away from the bluff."
    ],
    choiceLabel: "Choice 5",
    choices: [
      { text: "Find another path.", to: "p1b1b1" },
      { text: "Go back the way he came.", to: "p1b1b2" }
    ]
  },

  p1b1b1: {
    tag: "Path 1B-1B-1",
    title: "Find Another Path",
    text: [
      "The Coyote carefully searched for another route.",
      "Eventually, he found a safe trail around the bluff.",
      "He followed it until he reached the road again.",
      "He continued walking, determined not to make the same mistake twice."
    ],
    ending: "good"
  },

  p1b1b2: {
    tag: "Path 1B-1B-2",
    title: "Go Back",
    text: [
      "The Coyote decided that following the girls was too dangerous.",
      "He turned around and slowly walked back down the road.",
      "Although he had made a mistake by playing the eye game, he had avoided making another dangerous choice."
    ],
    ending: "good"
  },

  p1b2: {
    tag: "Path 1B-2",
    title: "Ignore the Bells",
    text: [
      "The Coyote decided not to follow the girls.",
      "He continued walking down the road, listening carefully to everything around him.",
      "Eventually, he reached a familiar place where he could rest.",
      "He realized that although he had made a foolish decision earlier, he could still avoid making another one."
    ],
    ending: "good"
  },

  p2: {
    tag: "Path 2",
    title: "Keep Walking",
    text: [
      "The Coyote decided not to play.",
      "He remembered that the birds had warned him about the game.",
      "“Maybe I'll play another day,” he said.",
      "He continued walking down the road, keeping his eyes and his vision.",
      "A little farther ahead, he came across a stream.",
      "He stopped to drink and looked at his reflection in the water.",
      "Then he heard something behind him.",
      "It was the birds.",
      "They had followed him.",
      "“Come back and play!” they called."
    ],
    choiceLabel: "Choice 2",
    choices: [
      { text: "Go back and play.", to: "p2a" },
      { text: "Keep walking.", to: "p2b" }
    ]
  },

  p2a: {
    tag: "Path 2A",
    title: "Go Back",
    text: [
      "The Coyote changed his mind.",
      "He walked back toward the birds.",
      "They began their strange eye-tossing game again.",
      "The Coyote watched carefully.",
      "This time, however, he remembered their warning.",
      "He decided that some games were not worth the risk.",
      "“Maybe another time,” he said.",
      "Then he turned around and continued down the road."
    ],
    ending: "good"
  },

  p2b: {
    tag: "Path 2B",
    title: "Keep Walking",
    text: [
      "The Coyote kept walking.",
      "The birds called after him, but he did not turn around.",
      "He traveled farther down the road and eventually reached a peaceful place where he could rest.",
      "He had avoided the dangerous game and kept his eyes.",
      "The Coyote smiled and continued on his journey."
    ],
    ending: "good"
  }
};

const totalEndings = Object.values(story).filter(s => s.ending).length;
let history = ["start"];
let found = new Set();
try { found = new Set(JSON.parse(localStorage.getItem("eyeJugglerEndings") || "[]")); } catch (e) {}

const card = document.getElementById("card");
const backBtn = document.getElementById("backBtn");
const trail = document.getElementById("trail");
const endingsEl = document.getElementById("endings");

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function render() {
  const id = history[history.length - 1];
  const s = story[id];
  card.innerHTML = "";
  card.style.animation = "none"; void card.offsetWidth; card.style.animation = "";

  card.appendChild(el("span", "tag", s.tag));
  card.appendChild(el("h2", null, s.title));

  const body = el("div", "story");
  s.text.forEach(t => body.appendChild(el("p", t.startsWith("“") ? "quote" : null, t)));
  card.appendChild(body);

  if (s.choices) {
    card.appendChild(el("div", "choice-label", s.choiceLabel + " — What should the Coyote do?"));
    const wrap = el("div", "choices");
    s.choices.forEach((c, i) => {
      const b = el("button", "choice-btn", (i === 0 ? "A. " : "B. ") + c.text);
      b.addEventListener("click", () => { history.push(c.to); render(); window.scrollTo({ top: 0, behavior: "smooth" }); });
      wrap.appendChild(b);
    });
    card.appendChild(wrap);
  } else {
    found.add(id);
    try { localStorage.setItem("eyeJugglerEndings", JSON.stringify([...found])); } catch (e) {}
    const box = el("div", "end-box " + s.ending);
    box.appendChild(el("p", "end-title", "The End"));
    box.appendChild(el("p", null, s.ending === "good" ? "The Coyote made it through safely." : "Oh no! The Coyote's journey ends here."));
    if (s.moral) box.appendChild(el("p", null, s.moral));
    card.appendChild(box);
    const lesson = el("div", "lesson");
    lesson.appendChild(el("strong", null, "Lesson: "));
    lesson.appendChild(document.createTextNode(LESSON));
    card.appendChild(lesson);
  }

  backBtn.disabled = history.length < 2;
  trail.textContent = "Your path: " + history.map(h => story[h].tag).join(" → ");
  endingsEl.innerHTML = "Endings discovered: " + found.size + " / " + totalEndings;
}

backBtn.addEventListener("click", () => { if (history.length > 1) { history.pop(); render(); } });
document.getElementById("restartBtn").addEventListener("click", () => { history = ["start"]; render(); window.scrollTo({ top: 0, behavior: "smooth" }); });

render();
</script>
</body>
</html>
